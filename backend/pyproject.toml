[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pbot-api"
version = "0.1.0"
description = "Backend platform otomasi website dengan persetujuan manusia"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1",
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "cryptography>=44.0",
  "croniter>=6.0",
  "fastapi>=0.115",
  "google-genai>=1.0",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "pyotp>=2.9",
  "python-multipart>=0.0.20",
  "redis>=5.2",
  "rq>=2.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]
worker = ["playwright==1.51.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"