databases:
  - name: pbot-db
    plan: basic-256mb
    databaseName: pbot
    user: pbot

services:
  - type: keyvalue
    name: pbot-redis
    plan: starter
    maxmemoryPolicy: noeviction

  - type: web
    name: pbot-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.api
    preDeployCommand: alembic -c alembic.ini upgrade head
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pbot-redis
          property: connectionString
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ARTIFACT_DIR
        value: /tmp/pbot-artifacts
      - key: BROWSER_MAX_CONCURRENCY
        value: "3"

  - type: worker
    name: pbot-worker
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pbot-redis
          property: connectionString
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: ENCRYPTION_KEY_VERSION
        value: "1"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ARTIFACT_DIR
        value: /tmp/pbot-artifacts
      - key: BROWSER_MAX_CONCURRENCY
        value: "3"

  - type: worker
    name: pbot-scheduler
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.api
    dockerCommand: python -m app.scheduler
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pbot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pbot-redis
          property: connectionString

  - type: web
    name: pbot-dashboard
    runtime: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: pbot-api
          property: host